name: Context-Aware Secret Leakage Security Scan

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Context-Aware IaC & Secret Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Scanner
        if: github.repository != 'swamitarun/Secret-Leakage-Detection-for-Cloud-CI-CD'
        uses: actions/checkout@v4
        with:
          repository: swamitarun/Secret-Leakage-Detection-for-Cloud-CI-CD
          ref: master
          path: scanner-tool

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -d scanner-tool ]; then pip install -r scanner-tool/requirements.txt; else pip install -r requirements.txt; fi
          pip install pytest

      - name: Run Automated Test Suite
        if: github.repository == 'swamitarun/Secret-Leakage-Detection-for-Cloud-CI-CD'
        run: |
          python -m pytest -q

      - name: Run Context-Aware Scanner
        id: scan
        run: |
          # Scan product code; tests, datasets, and generated reports contain intentional examples.
          TOOL_ROOT="${GITHUB_WORKSPACE}/scanner-tool"
          TARGET_ROOT="${GITHUB_WORKSPACE}"
          if [ ! -d scanner-tool ]; then TOOL_ROOT="${GITHUB_WORKSPACE}"; fi
          python "${TOOL_ROOT}/scanner/cli.py" "${TARGET_ROOT}" \
            --exclude tests \
            --exclude dataset \
            --exclude reports \
            --exclude scanner-tool \
            --json reports/scan_report.json \
            --html reports/scan_report.html \
            --sarif reports/scan_report.sarif \
            --fail-on HIGH

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('reports/scan_report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/scan_report.sarif

      - name: Upload Security Scan Artifacts
        if: always() && hashFiles('reports/scan_report.json', 'reports/scan_report.html', 'reports/scan_report.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: |
            reports/scan_report.json
            reports/scan_report.html
            reports/scan_report.sarif
